<!doctype html><html lang="ja"><meta charset="utf-8"><title>STEP5 storage tests</title>
<style>body{font:14px system-ui}iframe{width:1200px;height:800px;border:1px solid #ddd}li{padding:4px}.fail{color:#b00020}</style>
<h1>STEP5 storage tests</h1><p>ユーザーのlocalStorageに触れない独立したStorageモックで、再起動・保存障害・ジェスチャー中の書き込み数を検証します。</p><ol id="results"></ol><iframe></iframe>
<script>
(async()=>{
const key='simple-mind-map-data',memory=new Map();let writes=0,failRead=false,failWrite=false;
window.testStorage={getItem(k){if(failRead)throw Error('SecurityError');return memory.get(k)??null},setItem(k,v){if(failWrite)throw Error('QuotaExceededError');writes++;memory.set(k,v)},removeItem(k){memory.delete(k)}};
const frame=document.querySelector('iframe'),html=await (await fetch('../index.html', {cache:'no-store'})).text();
const boot='<base href="'+new URL('../',location.href).href+'"><script>Object.defineProperty(window,"localStorage",{value:parent.testStorage});<\/script>';
let w,d;
const pause=(ms=450)=>new Promise(r=>setTimeout(r,ms));
async function reload(){await new Promise(resolve=>{frame.onload=resolve;frame.srcdoc=html.replace('<head>','<head>'+boot)});w=frame.contentWindow;d=w.document;await pause(80);w.Element.prototype.setPointerCapture=function(){}};
const q=s=>d.querySelector(s),node=id=>q('[data-node-id="'+id+'"]'),saved=()=>{const data=JSON.parse(memory.get(key));if(data.version!==2)return data;const map=data.maps.find(m=>m.id===data.activeMapId);return {...map,version:1}};
const assert=(v,m)=>{if(!v)throw Error(m)};
const box=e=>{const r=e.getBoundingClientRect();return {x:r.x+r.width/2,y:r.y+r.height/2}};
const pointer=(e,type,id,x,y)=>e.dispatchEvent(new w.PointerEvent(type,{bubbles:true,cancelable:true,pointerId:id,clientX:x,clientY:y,button:0,pointerType:'touch',isPrimary:id===1}));
function click(e){if(typeof e==='string')e=q(e);const b=box(e);pointer(e,'pointerdown',1,b.x,b.y);pointer(e,'pointerup',1,b.x,b.y);e.dispatchEvent(new w.MouseEvent('click',{bubbles:true,detail:1}))}
const submit=text=>{q('#node-name').value=text;q('#node-form').dispatchEvent(new w.Event('submit',{bubbles:true,cancelable:true}))};
async function test(name,fn){const li=document.createElement('li');try{await fn();li.textContent='PASS '+name}catch(e){li.textContent='FAIL '+name+': '+e.message;li.className='fail'}document.querySelector('#results').append(li)}
await test('empty storage boots, autosaves, versions and timestamps',async()=>{await reload();assert(['保存中...','自動保存済み'].includes(q('#save-status-text').textContent),'save status missing');await pause();assert(saved().version===1&&saved().nodes.length===6,'initial save');assert(saved().nodes.every(n=>n.createdAt&&n.updatedAt),'timestamps');assert(q('#save-status-text').textContent==='自動保存済み','saved UI')});
await test('addition survives restart and IDs do not collide',async()=>{click('#quick-add');submit('保存する子');await pause();assert(saved().nodes.length===7,'add not saved');await reload();assert(node('node-1').textContent==='保存する子','add not restored');assert(d.querySelectorAll('.node.is-selected').length===0,'selection restored');click('#quick-add');submit('次の子');await pause();assert(saved().nodes.some(n=>n.id==='node-2'),'duplicate id')});
await test('root edit and title survive restart',async()=>{node('root').dispatchEvent(new w.KeyboardEvent('keydown',{bubbles:true,key:'F2'}));submit('保存されたアイデア');await pause();await reload();assert(node('root').textContent==='保存されたアイデア'&&q('h1').textContent==='マイマップ','root title');});
await test('drag has zero writes mid-gesture, then saves exact position and date',async()=>{await pause();const e=node('work'),b=box(e),old=saved().nodes.find(n=>n.id==='work').updatedAt,start=writes;pointer(e,'pointerdown',1,b.x,b.y);for(let i=1;i<=20;i++)pointer(e,'pointermove',1,b.x+i*2,b.y+i);await pause(600);assert(writes===start,'saved mid-drag');const style=e.style.cssText;pointer(e,'pointerup',1,b.x+40,b.y+20);await pause();assert(writes===start+1,'not one save');assert(saved().nodes.find(n=>n.id==='work').updatedAt>old,'date unchanged');await reload();assert(node('work').style.cssText===style,'position drift')});
await test('pan and pinch persist viewport without mid-gesture writes',async()=>{await pause();let start=writes;const c=q('.canvas');pointer(c,'pointerdown',1,300,160);pointer(c,'pointermove',1,380,200);await pause();assert(writes===start,'pan writes');pointer(c,'pointerup',1,380,200);await pause();const pan=q('#mindMapWorld').style.transform;await reload();assert(q('#mindMapWorld').style.transform===pan,'pan restore');start=writes;pointer(q('.canvas'),'pointerdown',1,400,200);pointer(q('.canvas'),'pointerdown',2,500,200);pointer(q('.canvas'),'pointermove',2,560,220);await pause();assert(writes===start,'pinch writes');pointer(q('.canvas'),'pointerup',2,560,220);await pause();assert(writes===start,'saved with finger down');pointer(q('.canvas'),'pointerup',1,400,200);await pause();const zoom=q('#mindMapWorld').style.transform;await reload();assert(q('#mindMapWorld').style.transform===zoom,'pinch restore')});
await test('wheel debounce, fit and center saves',async()=>{await pause();const c=q('.canvas'),start=writes;for(let i=0;i<20;i++)c.dispatchEvent(new w.WheelEvent('wheel',{bubbles:true,cancelable:true,deltaY:-2,clientX:400,clientY:300}));assert(writes===start,'sync wheel writes');await pause();assert(writes===start+1,'debounce');const v=saved().viewport;await reload();assert(Math.abs(new w.DOMMatrix(w.getComputedStyle(q('#mindMapWorld')).transform).a-v.scale)<0.00001,'scale restore');click('[data-action="fit-view"]');await pause();w.centerOnRoot();await pause();assert(saved().viewport.scale>=.4,'center save')});
await test('delete remains deleted, empty input and selection do not save',async()=>{click(node('node-2'));click('[data-action="delete-node"]');click('[data-action="confirm-delete"]');await pause();await reload();assert(!node('node-2'),'delete restore');await pause();const start=writes;click(node('work'));await pause();assert(writes===start,'selection saved');node('work').dispatchEvent(new w.KeyboardEvent('keydown',{bubbles:true,key:'F2'}));submit('  ');assert(q('#node-editor').open,'empty accepted');click('[data-action="cancel-edit"]');await pause();assert(writes===start,'empty saved')});
await test('quota failure is visible and a later operation retries',async()=>{failWrite=true;click('[data-action="zoom-in"]');await pause();assert(q('#save-status-text').textContent==='保存できませんでした','failure UI');assert(node('root'),'app died');failWrite=false;click('[data-action="zoom-out"]');await pause();assert(q('#save-status-text').textContent==='自動保存済み','retry')});
await test('corrupt JSON is backed up and repaired once',async()=>{memory.set(key,'{broken');await reload();assert(node('root'),'blank page');await pause();assert(memory.get(key+'-recovery')==='{broken','backup');assert(saved().nodes.length===6,'fallback save');await reload();assert(q('#node-notice').hidden,'repeated notice')});
await test('invalid schemas, root, parents and cycles fall back safely',async()=>{const base=saved();const fixtures=[{...base,version:9},{...base,nodes:{}},{...base,viewport:null},{...base,nodes:base.nodes.filter(n=>n.id!=='root')},{...base,nodes:base.nodes.map(n=>n.id==='work'?{...n,parentId:'missing'}:n)},{...base,nodes:base.nodes.map(n=>n.id==='work'?{...n,parentId:'work'}:n)},{...base,nodes:[...base.nodes,base.nodes[0]]}];for(const data of fixtures){memory.set(key,JSON.stringify(data));await reload();assert(node('root')&&d.querySelectorAll('.node').length===6,'invalid schema crashed');await pause()}});
await test('abnormal viewport clamped and unavailable storage still boots',async()=>{const data=saved();data.viewport={x:1e30,y:'bad',scale:50};memory.set(key,JSON.stringify(data));await reload();assert(q('.zoom-value').textContent==='250%','clamp');assert(q('#mindMapWorld').style.transform.includes('translate(0px, 0px)'),'viewport reset');failRead=true;await reload();assert(node('root')&&q('#save-status-text').textContent==='保存できませんでした','read denied');failRead=false});
await test('320px mobile restores moved coordinates and viewport',async()=>{memory.clear();frame.style.width='320px';frame.style.height='568px';await reload();await pause();click('[data-action="zoom-in"]');await pause();const e=node('study'),b=box(e);pointer(e,'pointerdown',1,b.x,b.y);pointer(e,'pointermove',1,b.x+20,b.y+15);pointer(e,'pointerup',1,b.x+20,b.y+15);await pause();const style=e.style.cssText,world=q('#mindMapWorld').style.transform;await reload();assert(node('study').style.cssText===style&&q('#mindMapWorld').style.transform===world,'mobile drift');assert(q('.save-status').getBoundingClientRect().height>0,'status hidden');assert(d.documentElement.scrollWidth===320,'overflow')});
document.body.dataset.done='true';
})();
</script></html>
