<!doctype html><html lang="ja"><meta charset="utf-8"><title>STEP10 color tests</title>
<style>body{font:14px system-ui}iframe{width:1200px;height:800px;border:1px solid #ddd}li{padding:4px}.fail{color:#b00020}</style>
<h1>STEP10 color tests</h1><p>独立Storageモックで色・履歴・検索・JSON・ジェスチャーを検証します。</p><ol id="results"></ol><iframe></iframe>
<script>
(async()=>{
const key='simple-mind-map-data',memory=new Map();let writes=0,blob=null;const now=Date.now();
const node=(id,text,parentId,x,y,color)=>({id,text,parentId,x,y,color,createdAt:now,updatedAt:now});
const data={version:2,maps:[{id:'a',title:'A',nodes:[node('ra','中心',null,400,270,'blue'),node('ca','検索対象','ra',650,160,'blue')],viewport:{x:0,y:0,scale:1},createdAt:now,updatedAt:now},{id:'b',title:'B',nodes:[node('rb','別マップ',null,400,270,'purple')],viewport:{x:0,y:0,scale:1},createdAt:now,updatedAt:now}],activeMapId:'a',updatedAt:now};memory.set(key,JSON.stringify(data));
window.testStorage={getItem:k=>memory.get(k)??null,setItem(k,v){writes++;memory.set(k,v)},removeItem:k=>memory.delete(k)};
const frame=document.querySelector('iframe'),html=await(await fetch('../index.html',{cache:'no-store'})).text(),boot='<base href="'+new URL('../',location.href).href+'"><script>Object.defineProperty(window,"localStorage",{value:parent.testStorage});<\/script>';let w,d;
const pause=(ms=450)=>new Promise(r=>setTimeout(r,ms));async function reload(){await new Promise(resolve=>{frame.onload=resolve;frame.srcdoc=html.replace('<head>','<head>'+boot)});w=frame.contentWindow;d=w.document;await pause(80);w.Element.prototype.setPointerCapture=function(){};w.URL.createObjectURL=b=>{blob=b;return'blob:test'};w.URL.revokeObjectURL=()=>{};w.HTMLAnchorElement.prototype.click=function(){}}await reload();
const q=s=>d.querySelector(s),assert=(v,m)=>{if(!v)throw Error(m)},current=()=>JSON.parse(memory.get(key)).maps.find(m=>m.id===JSON.parse(memory.get(key)).activeMapId);
async function test(name,fn){const li=document.createElement('li');try{await fn();li.textContent='PASS '+name}catch(e){li.textContent='FAIL '+name+': '+e.message;li.className='fail'}document.querySelector('#results').append(li)}
const choose=color=>q('.color-option[data-color="'+color+'"]').click(),select=id=>q('.node[data-node-id="'+id+'"]').click();
const center=e=>{const r=e.getBoundingClientRect();return{x:r.x+r.width/2,y:r.y+r.height/2}},pointer=(e,type,id,x,y)=>e.dispatchEvent(new w.PointerEvent(type,{bubbles:true,cancelable:true,pointerId:id,clientX:x,clientY:y,button:0,pointerType:'touch',isPrimary:id===1}));
async function importData(value){const input=q('#backup-file'),file=new w.File([JSON.stringify(value)],'colors.json',{type:'application/json'});Object.defineProperty(input,'files',{value:[file],configurable:true});input.dispatchEvent(new w.Event('change',{bubbles:true}));await pause(60);q('[data-action="confirm-import"]').click();await pause()}
await test('style button requires a selected node',()=>assert(q('[data-action="style"]').disabled,'enabled without selection'));
await test('palette opens with eight accessible colors and current check',()=>{select('ca');q('[data-action="style"]').click();assert(!q('#color-palette').hidden&&d.querySelectorAll('.color-option').length===8,'palette');assert(q('.color-option[data-color="blue"]').classList.contains('is-current')&&q('.color-option[data-color="blue"]').getAttribute('aria-pressed')==='true','current')});
await test('green change creates one history and same color creates none',()=>{choose('green');assert(q('.node[data-node-id="ca"]').dataset.color==='green'&&q('.node[data-node-id="ca"]').classList.contains('is-selected'),'change');choose('green');q('[data-action="undo"]').click();assert(q('.node[data-node-id="ca"]').dataset.color==='blue','same color history');q('[data-action="redo"]').click();assert(q('.node[data-node-id="ca"]').dataset.color==='green','redo')});
await test('color autosaves and survives reload',async()=>{await pause();assert(current().nodes.find(n=>n.id==='ca').color==='green','save');await reload();assert(q('.node[data-node-id="ca"]').dataset.color==='green','reload')});
await test('maps keep independent colors and palette follows selection',()=>{q('[data-map-id="b"]').click();select('rb');q('[data-action="style"]').click();assert(q('.color-option[data-color="purple"]').classList.contains('is-current'),'palette switch');q('[data-map-id="a"]').click();assert(q('.node[data-node-id="ca"]').dataset.color==='green'&&q('[data-action="style"]').disabled,'map independence')});
await test('search highlight does not replace node color',()=>{const input=q('#node-search'),target=q('.node[data-node-id="ca"]'),before=w.getComputedStyle(target).backgroundColor;input.value='検索';input.dispatchEvent(new w.Event('input',{bubbles:true}));assert(target.classList.contains('is-search-match')&&w.getComputedStyle(target).backgroundColor===before,'search color');input.value='';input.dispatchEvent(new w.Event('input',{bubbles:true}));assert(target.dataset.color==='green','search clear')});
await test('JSON export contains the saved color',async()=>{q('[data-action="more"]').click();q('[data-backup-action="export"]').click();await pause(50);const exported=JSON.parse(await blob.text());assert(exported.maps.find(m=>m.id==='a').nodes.find(n=>n.id==='ca').color==='green','export color')});
await test('JSON import restores colors and invalid colors fall back',async()=>{const imported={version:2,maps:[{id:'i',title:'Imported',nodes:[node('ri','復元',null,400,270,'yellow'),node('ci','子','ri',650,200,'not-a-color')],viewport:{x:0,y:0,scale:1},createdAt:1,updatedAt:2}],activeMapId:'i',updatedAt:3};await importData(imported);assert(q('.node[data-node-id="ri"]').dataset.color==='yellow'&&q('.node[data-node-id="ci"]').dataset.color==='blue','import/fallback')});
await test('root keeps main shape while changing color',()=>{select('ri');q('[data-action="style"]').click();choose('red');const root=q('.main-node');assert(root.dataset.color==='red'&&root.classList.contains('main-node'),'root')});
await test('drag, connection, pan and zoom work after color change',()=>{const child=q('.node[data-node-id="ci"]'),b=center(child),old=child.style.left;pointer(child,'pointerdown',1,b.x,b.y);pointer(child,'pointermove',1,b.x+24,b.y+16);pointer(child,'pointerup',1,b.x+24,b.y+16);assert(child.style.left!==old&&d.querySelectorAll('.connections path').length===1,'drag/line');const canvas=q('#mindmap-canvas'),c=center(canvas),world=q('#mindMapWorld').style.transform;pointer(canvas,'pointerdown',2,c.x,c.y);pointer(canvas,'pointermove',2,c.x+20,c.y);pointer(canvas,'pointerup',2,c.x+20,c.y);assert(q('#mindMapWorld').style.transform!==world,'pan');const zoom=q('.zoom-value').textContent;q('[data-action="zoom-in"]').click();assert(q('.zoom-value').textContent!==zoom,'zoom')});
await test('Escape and outside click close palette',()=>{select('ci');q('[data-action="style"]').click();d.dispatchEvent(new w.KeyboardEvent('keydown',{key:'Escape',bubbles:true,cancelable:true}));assert(q('#color-palette').hidden,'escape');q('[data-action="style"]').click();q('.map-heading').click();assert(q('#color-palette').hidden,'outside')});
await test('390px mobile palette stays usable with 48px targets',async()=>{frame.style.width='390px';frame.style.height='844px';await pause(100);select('ri');select('ci');q('[data-action="style"]').click();const palette=q('#color-palette').getBoundingClientRect(),button=q('.color-option[data-color="gray"]').getBoundingClientRect();assert(palette.left>=0&&palette.right<=390&&button.height>=44,`mobile layout ${palette.left}/${palette.right}/${button.height}`);choose('gray');assert(q('.node[data-node-id="ci"]').dataset.color==='gray','mobile tap')});
document.body.dataset.done='true';
})();
</script></html>
