<!doctype html><html lang="ja"><meta charset="utf-8"><title>STEP18 stability and performance tests</title>
<style>body{font:14px system-ui}iframe{width:1200px;height:800px;border:1px solid #ddd}li{padding:4px}.fail{color:#b00020}</style>
<h1>STEP18 stability and performance tests</h1><p>200ノード、DOM再利用、保存回数、ドラッグ、検索、PWA更新を検証します。</p><ol id="results"></ol><iframe></iframe>
<script>
(async()=>{
const root=new URL('../',location.href),html=await(await fetch('../index.html',{cache:'no-store'})).text(),source=await(await fetch('../script.js',{cache:'no-store'})).text(),sw=await(await fetch('../service-worker.js',{cache:'no-store'})).text();
const key='simple-mind-map-data',now=Date.now(),memory=new Map();let writes=0;
const largeNodes=[{id:'root',text:'大規模マップ',parentId:null,x:400,y:250,color:'blue',createdAt:now,updatedAt:now}];
for(let i=1;i<200;i++){const angle=i/199*Math.PI*2;largeNodes.push({id:'node-'+i,text:'ノード '+i,parentId:i<25?'root':'node-'+(1+(i%24)),x:400+Math.cos(angle)*(180+(i%8)*35),y:250+Math.sin(angle)*(120+(i%6)*28),color:['blue','green','orange','purple','cyan'][i%5],createdAt:now,updatedAt:now,moved:true})}
const maps=[{id:'large',title:'200ノード',nodes:largeNodes,viewport:{x:0,y:0,scale:1},createdAt:now,updatedAt:now,isFavorite:false,deletedAt:null},{id:'other',title:'別のマップ',nodes:[{id:'other-root',text:'別マップ',parentId:null,x:400,y:250,color:'blue',createdAt:now,updatedAt:now}],viewport:{x:0,y:0,scale:1},createdAt:now,updatedAt:now,isFavorite:false,deletedAt:null}];
memory.set(key,JSON.stringify({version:2,maps,activeMapId:'large',updatedAt:now}));
window.testStorage={getItem:k=>memory.get(k)??null,setItem(k,v){writes++;memory.set(k,v)},removeItem:k=>memory.delete(k)};
const frame=document.querySelector('iframe'),boot='<base href="'+root.href+'"><script>Object.defineProperty(window,"localStorage",{value:parent.testStorage});<\/script>';let w,d;
await new Promise(resolve=>{frame.onload=resolve;frame.srcdoc=html.replace('<head>','<head>'+boot)});w=frame.contentWindow;d=w.document;await new Promise(r=>setTimeout(r,180));w.Element.prototype.setPointerCapture=function(){};
const q=s=>d.querySelector(s),all=s=>[...d.querySelectorAll(s)],pause=(ms=100)=>new Promise(r=>setTimeout(r,ms)),assert=(v,m)=>{if(!v)throw Error(m)};
const pointer=(target,type,id,x,y)=>target.dispatchEvent(new w.PointerEvent(type,{bubbles:true,cancelable:true,pointerId:id,clientX:x,clientY:y,button:0,buttons:type==='pointerup'?0:1,pointerType:'mouse',isPrimary:true}));
async function test(name,fn){const li=document.createElement('li');try{await fn();li.textContent='PASS '+name}catch(e){li.textContent='FAIL '+name+': '+e.message;li.className='fail'}document.querySelector('#results').append(li)}

await test('200 nodes and 199 connections render completely',()=>{assert(all('.node').length===200,'nodes '+all('.node').length);assert(all('.connections path').length===199,'paths '+all('.connections path').length)});
await test('large-map redraw stays responsive',()=>{const start=performance.now();for(let i=0;i<3;i++)w.renderNodes();const elapsed=performance.now()-start;assert(elapsed<1500,'three redraws took '+Math.round(elapsed)+'ms');document.querySelector('#results').dataset.redrawMs=String(Math.round(elapsed))});
await test('rendering uses indexed DOM and batched insertion',()=>{assert(source.includes('const nodeElements = new Map()')&&source.includes('const connectionPaths = new Map()'),'DOM indexes');assert(source.includes('document.createDocumentFragment()')&&source.includes('fragment.append(element)'),'fragment');assert(!source.includes("[...stage.querySelectorAll('.node')].find"),'linear node lookup')});
await test('drag updates existing connection without rebuilding the map',()=>{const node=q('[data-node-id="node-30"]'),path=q('.connections path[data-child-id="node-30"]'),count=all('.node').length,r=node.getBoundingClientRect();pointer(node,'pointerdown',1,r.x+r.width/2,r.y+r.height/2);pointer(node,'pointermove',1,r.x+r.width/2+35,r.y+r.height/2+20);assert(q('.connections path[data-child-id="node-30"]')===path,'path replaced');assert(all('.node').length===count,'nodes rebuilt');pointer(node,'pointerup',1,r.x+r.width/2+35,r.y+r.height/2+20)});
await test('clicking the active map does not write storage',async()=>{await pause(450);const before=writes;q('.map-item[data-map-id="large"]').click();await pause(450);assert(writes===before,'writes '+(writes-before))});
await test('switching maps still persists activeMapId once',async()=>{const before=writes;q('.map-item[data-map-id="other"]').click();await pause(450);assert(writes===before+1,'writes '+(writes-before));assert(JSON.parse(memory.get(key)).activeMapId==='other','active map')});
await test('search remains correct on a 200-node map',async()=>{q('.map-item[data-map-id="large"]').click();await pause(450);const input=q('#node-search');input.value='ノード 199';input.dispatchEvent(new w.Event('input',{bubbles:true}));assert(all('.node.is-search-match').length===1,'matches');assert(q('.node.is-search-match').dataset.nodeId==='node-199','wrong result')});
await test('pan and zoom do not rebuild node DOM',()=>{const node=q('[data-node-id="node-1"]'),canvas=q('.canvas'),r=canvas.getBoundingClientRect();q('[data-action="zoom-in"]').click();assert(q('[data-node-id="node-1"]')===node,'zoom rebuild');pointer(canvas,'pointerdown',8,r.x+80,r.y+80);pointer(canvas,'pointermove',8,r.x+115,r.y+105);pointer(canvas,'pointerup',8,r.x+115,r.y+105);assert(q('[data-node-id="node-1"]')===node,'pan rebuild')});
await test('PWA update requires every core file before activation',()=>{assert(sw.includes('Promise.all(REQUIRED_SHELL.map')&&sw.includes('Promise.allSettled(OPTIONAL_SHELL.map'),'shell split');assert(sw.includes('await caches.delete(CACHE_NAME)')&&sw.indexOf('await self.skipWaiting()')>sw.indexOf('Promise.all(REQUIRED_SHELL.map'),'atomic install');assert(sw.includes("simple-mind-map-app-v19-1"),'cache version')});
await test('mobile layout still exposes the core controls',async()=>{frame.style.width='390px';frame.style.height='844px';await pause(160);assert(getComputedStyle(q('.sidebar')).display==='none','sidebar');assert(q('[data-action="add-node"]')&&q('[data-action="edit-node"]')&&q('[data-action="delete-node"]'),'tools');assert(q('.quick-add').getBoundingClientRect().width>=52,'quick add')});
document.body.dataset.done='true';
})();
</script></html>
