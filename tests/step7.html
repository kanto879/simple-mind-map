<!doctype html><html lang="ja"><meta charset="utf-8"><title>STEP7 map tests</title>
<style>body{font:14px system-ui}iframe{width:1200px;height:800px;border:1px solid #ddd}li{padding:4px}.fail{color:#b00020}</style>
<h1>STEP7 map tests</h1><p>ユーザーのlocalStorageに触れない独立したStorageモックで、再起動・保存障害・ジェスチャー中の書き込み数を検証します。</p><ol id="results"></ol><iframe></iframe>
<script>
(async()=>{
const key='simple-mind-map-data',memory=new Map();let writes=0,failRead=false,failWrite=false;
window.testStorage={getItem(k){if(failRead)throw Error('SecurityError');return memory.get(k)??null},setItem(k,v){if(failWrite)throw Error('QuotaExceededError');writes++;memory.set(k,v)},removeItem(k){memory.delete(k)}};
const frame=document.querySelector('iframe'),html=await (await fetch('../index.html', {cache:'no-store'})).text();
const boot='<base href="'+new URL('../',location.href).href+'"><script>Object.defineProperty(window,"localStorage",{value:parent.testStorage});<\/script>';
let w,d;
const pause=(ms=450)=>new Promise(r=>setTimeout(r,ms));
async function reload(){await new Promise(resolve=>{frame.onload=resolve;frame.srcdoc=html.replace('<head>','<head>'+boot)});w=frame.contentWindow;d=w.document;await pause(80);w.Element.prototype.setPointerCapture=function(){}};
const q=s=>d.querySelector(s),node=id=>q('[data-node-id="'+id+'"]'),saved=()=>JSON.parse(memory.get(key));
const assert=(v,m)=>{if(!v)throw Error(m)};
const box=e=>{const r=e.getBoundingClientRect();return {x:r.x+r.width/2,y:r.y+r.height/2}};
const pointer=(e,type,id,x,y)=>e.dispatchEvent(new w.PointerEvent(type,{bubbles:true,cancelable:true,pointerId:id,clientX:x,clientY:y,button:0,pointerType:'touch',isPrimary:id===1}));
function click(e){if(typeof e==='string')e=q(e);const b=box(e);pointer(e,'pointerdown',1,b.x,b.y);pointer(e,'pointerup',1,b.x,b.y);e.dispatchEvent(new w.MouseEvent('click',{bubbles:true,detail:1}))}
const submit=text=>{q('#node-name').value=text;q('#node-form').dispatchEvent(new w.Event('submit',{bubbles:true,cancelable:true}))};
async function test(name,fn){const li=document.createElement('li');try{await fn();li.textContent='PASS '+name}catch(e){li.textContent='FAIL '+name+': '+e.message;li.className='fail'}document.querySelector('#results').append(li)}

const active=()=>saved().maps.find(m=>m.id===saved().activeMapId);
const root=()=>q('.main-node');
const mapSubmit=title=>{q('#map-name').value=title;q('#map-form').dispatchEvent(new w.Event('submit',{bubbles:true,cancelable:true}))};
const create=async title=>{click('#new-map');mapSubmit(title);await pause()};
const menu=(id,action)=>{const row=q('[data-map-id="'+id+'"]').parentElement;click(row.querySelector('.map-more'));click('[data-map-action="'+action+'"]')};
let firstId,secondId,copyId,original;
await test('v1 migration preserves nodes, root, viewport and dates',async()=>{
 memory.set(key,JSON.stringify({version:1,nodes:[{id:'root',parentId:null,text:'既存の案',x:400,y:270,color:'blue',createdAt:11,updatedAt:22},{id:'old-child',parentId:'root',text:'失いたくない内容',x:650,y:120,color:'purple',moved:true,createdAt:12,updatedAt:23}],viewport:{x:22,y:33,scale:1.2},updatedAt:24}));
 await reload();await pause();assert(saved().version===2&&saved().maps.length===1,'migration');assert(active().nodes[1].text==='失いたくない内容'&&active().nodes[1].createdAt===12,'data lost');assert(active().viewport.x===22&&active().viewport.scale===1.2,'viewport');assert(q('h1').textContent==='マイマップ'&&root().textContent==='既存の案','title separated');firstId=active().id;original=JSON.stringify(active().nodes)
});
await test('create empty map, reject empty name, switch and clear history',async()=>{click('#new-map');mapSubmit('   ');assert(q('#map-dialog').open,'blank accepted');mapSubmit('  副業  ');await pause();secondId=active().id;assert(active().title==='副業'&&active().nodes.length===1,'new root');click('#quick-add');submit('副業の子');await pause();assert(!q('[data-action="undo"]').disabled,'no history');click('[data-map-id="'+firstId+'"]');await pause();assert(JSON.stringify(active().nodes)===original,'cross contamination');assert(q('[data-action="undo"]').disabled,'history mixed');click('[data-map-id="'+secondId+'"]');await pause();assert(active().nodes.length===2,'new data lost')});
await test('map viewport independence and rename does not rename root',async()=>{click('[data-action="zoom-in"]');await pause();const v=JSON.stringify(active().viewport);click('[data-map-id="'+firstId+'"]');await pause();assert(active().viewport.scale===1.2,'old zoom lost');menu(secondId,'rename');assert(saved().activeMapId===firstId,'menu switched map');mapSubmit('  副業計画  ');await pause();assert(q('h1').textContent==='マイマップ','inactive rename changed title');click('[data-map-id="'+secondId+'"]');await pause();assert(q('h1').textContent==='副業計画'&&root().textContent==='新しいアイデア','rename root');assert(JSON.stringify(active().viewport)===v,'viewport mixed');root().dispatchEvent(new w.KeyboardEvent('keydown',{bubbles:true,key:'F2'}));submit('rootだけ編集');await pause();assert(q('h1').textContent==='副業計画','root changed map title');click('[data-action="undo"]');assert(root().textContent==='新しいアイデア'&&q('h1').textContent==='副業計画','undo root title')});
await test('duplicate remaps every node ID including root and parent links',async()=>{await pause();const source=active();menu(source.id,'duplicate');await pause();copyId=active().id;const copied=active();assert(copied.title==='副業計画のコピー','copy name');assert(copied.nodes.every(n=>!source.nodes.some(o=>o.id===n.id)),'duplicate IDs');const ids=new Set(copied.nodes.map(n=>n.id));assert(copied.nodes.filter(n=>n.parentId===null).length===1&&copied.nodes.every(n=>n.parentId===null||ids.has(n.parentId)),'parents');assert(JSON.stringify(source.viewport)===JSON.stringify(copied.viewport),'copy viewport');root().dispatchEvent(new w.KeyboardEvent('keydown',{bubbles:true,key:'F2'}));submit('コピーのみ変更');await pause();click('[data-map-id="'+secondId+'"]');assert(root().textContent==='新しいアイデア','shared reference')});
await test('per-map node drag, connections, undo and autosave',async()=>{const e=root(),b=box(e),old=e.style.cssText;pointer(e,'pointerdown',1,b.x,b.y);pointer(e,'pointermove',1,b.x+20,b.y+15);pointer(e,'pointerup',1,b.x+20,b.y+15);click('[data-action="undo"]');assert(root().style.cssText===old,'drag undo');click('[data-action="redo"]');await pause();assert(active().nodes.find(n=>n.parentId===null).moved,'drag save');assert(d.querySelectorAll('.connections path').length===active().nodes.length-1,'lines');click('#quick-add');submit('さらに追加');await pause();click('[data-action="delete-node"]');click('[data-action="confirm-delete"]');await pause();assert(active().nodes.length===2,'node delete')});
await test('reload preserves all maps and last active map',async()=>{click('[data-map-id="'+copyId+'"]');await pause();const before=JSON.stringify(saved().maps);await reload();await pause();assert(saved().activeMapId===copyId&&JSON.stringify(saved().maps)===before,'reload maps');assert(root().textContent==='コピーのみ変更','active root');assert(q('[data-action="undo"]').disabled,'history restore')});
await test('map delete cancellation and active-map fallback',async()=>{menu(copyId,'delete');assert(q('#map-dialog-description').textContent.includes('保持'),'confirmation');click('[data-action="cancel-map"]');await pause(20);assert(saved().maps.length===3,'cancel deleted');menu(copyId,'delete');mapSubmit('');await pause();assert(saved().maps.length===3&&saved().maps.find(m=>m.id===copyId).deletedAt&&saved().activeMapId!==copyId,'trash active');assert(!q('[data-map-id="'+copyId+'"]')&&q('[data-action="undo"]').disabled,'old history')});
await test('last map deletion creates one empty map',async()=>{for(const id of saved().maps.filter(m=>!m.deletedAt).map(m=>m.id)){menu(id,'delete');mapSubmit('');await pause()}const normal=saved().maps.filter(m=>!m.deletedAt);assert(normal.length===1&&active().nodes.length===1,'last delete');assert(root()&&saved().maps.filter(m=>m.deletedAt).length===3,'root/trash missing')});
await test('invalid activeMapId falls back, write failure keeps in-memory maps',async()=>{const data=saved();data.activeMapId='missing';memory.set(key,JSON.stringify(data));await reload();assert(root(),'bad active blank');failWrite=true;await create('保存エラーテスト');assert(q('h1').textContent==='保存エラーテスト','lost unsaved map');assert(q('#save-status-text').textContent==='保存できませんでした','write error UI');failWrite=false;click('[data-action="zoom-in"]');await pause();assert(saved().maps.filter(m=>!m.deletedAt).length===2,'retry all maps')});
await test('mobile drawer opens, backdrop closes, selection closes and switches',async()=>{frame.style.width='320px';frame.style.height='568px';await pause(100);click('[data-action="toggle-sidebar"]');assert(q('.sidebar').classList.contains('is-open')&&!q('#drawer-overlay').hidden,'drawer closed');click('#drawer-overlay');assert(!q('.sidebar').classList.contains('is-open'),'overlay close');const target=saved().maps.find(m=>!m.deletedAt);click('[data-action="toggle-sidebar"]');click('[data-map-id="'+target.id+'"]');await pause();assert(!q('.sidebar').classList.contains('is-open')&&!q('.workspace').inert,'drawer stuck');assert(saved().activeMapId===target.id,'mobile switch');assert(d.documentElement.scrollWidth===320,'overflow')});
document.body.dataset.done='true';
})();
</script></html>
