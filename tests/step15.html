<!doctype html><html lang="ja"><meta charset="utf-8"><title>STEP15 PWA tests</title>
<style>body{font:14px system-ui}iframe{width:390px;height:844px;border:1px solid #ddd}li{padding:4px}.fail{color:#b00020}</style>
<h1>STEP15 PWA tests</h1><p>manifest、アイコン、Service Worker、データ保護、通常画面を検証します。</p><ol id="results"></ol><iframe></iframe>
<script>
(async()=>{
const root=new URL('../',location.href),manifest=await(await fetch('../manifest.webmanifest',{cache:'no-store'})).json(),sw=await(await fetch('../service-worker.js',{cache:'no-store'})).text(),index=await(await fetch('../index.html',{cache:'no-store'})).text();
const now=Date.now(),key='simple-mind-map-data',saved={version:2,maps:[{id:'pwa',title:'オフラインマップ',nodes:[{id:'root',text:'保存済みマップ',parentId:null,x:400,y:270,color:'blue',createdAt:now,updatedAt:now}],viewport:{x:10,y:20,scale:1.1},createdAt:now,updatedAt:now,isFavorite:true,deletedAt:null}],activeMapId:'pwa',updatedAt:now};
const memory=new Map([[key,JSON.stringify(saved)]]);let writes=0;window.testStorage={getItem:k=>memory.get(k)??null,setItem(k,v){writes++;memory.set(k,v)},removeItem:k=>memory.delete(k)};
const frame=document.querySelector('iframe'),boot='<base href="'+root.href+'"><script>Object.defineProperty(window,"localStorage",{value:parent.testStorage});<\/script>';await new Promise(resolve=>{frame.onload=resolve;frame.srcdoc=index.replace('<head>','<head>'+boot)});const w=frame.contentWindow,d=w.document;await new Promise(r=>setTimeout(r,120));
const q=s=>d.querySelector(s),assert=(v,m)=>{if(!v)throw Error(m)},pause=(ms=80)=>new Promise(r=>setTimeout(r,ms));
async function test(name,fn){const li=document.createElement('li');try{await fn();li.textContent='PASS '+name}catch(e){li.textContent='FAIL '+name+': '+e.message;li.className='fail'}document.querySelector('#results').append(li)}
const imageSize=src=>new Promise((resolve,reject)=>{const image=new Image();image.onload=()=>resolve([image.naturalWidth,image.naturalHeight]);image.onerror=reject;image.src=new URL(src,root).href});

await test('manifest has installable identity and standalone display',()=>{assert(manifest.name==='Simple Mind Map'&&manifest.short_name==='Mind Map','name');assert(manifest.start_url==='./'&&manifest.scope==='./'&&manifest.id==='./','relative scope');assert(manifest.display==='standalone'&&manifest.background_color==='#ffffff'&&manifest.theme_color==='#4386ed','display/theme')});
await test('manifest exposes valid any and maskable icons',()=>{const sizes=manifest.icons.map(icon=>`${icon.sizes}:${icon.purpose}`);assert(sizes.includes('192x192:any')&&sizes.includes('512x512:any')&&sizes.includes('512x512:maskable'),'icons');manifest.icons.forEach(icon=>assert(icon.src.startsWith('./')&&!icon.src.startsWith('/'),'absolute icon'))});
await test('icon files are real 192 and 512 PNG images',async()=>{assert((await imageSize('icons/icon-192.png')).join('x')==='192x192','192');assert((await imageSize('icons/icon-512.png')).join('x')==='512x512','512');assert((await imageSize('icons/icon-maskable-512.png')).join('x')==='512x512','maskable')});
await test('head links manifest, Apple icon and matching theme relatively',()=>{assert(index.includes('rel="manifest" href="./manifest.webmanifest"'),'manifest link');assert(index.includes('rel="apple-touch-icon" href="./icons/icon-192.png"'),'apple icon');assert(index.includes('name="theme-color" content="#4386ed"'),'theme');assert(index.includes('apple-mobile-web-app-capable'),'apple capable')});
await test('all app-shell files exist and no external CDN is required',async()=>{for(const path of ['','index.html','style.css?v=15','script.js?v=15','manifest.webmanifest','icons/icon-192.png','icons/icon-512.png','icons/icon-maskable-512.png']){const response=await fetch(new URL(path,root),{cache:'no-store'});assert(response.ok,'missing '+path)}assert(!/https?:\/\/(?!www\.w3\.org)/.test(index),'external resource')});
await test('service worker uses a versioned, scope-relative app shell',()=>{assert(sw.includes("simple-mind-map-app-v15-1")&&sw.includes("const CACHE_PREFIX = 'simple-mind-map-'") ,'cache name');for(const file of ['./index.html','./style.css?v=15','./script.js?v=15','./manifest.webmanifest','./icons/icon-192.png','./icons/icon-512.png','./icons/icon-maskable-512.png'])assert(sw.includes(`'${file}'`),'cache '+file);assert(sw.includes('self.registration.scope'),'scope base')});
await test('install and activation update safely',()=>{assert(sw.includes('Promise.allSettled')&&sw.includes('self.skipWaiting()'),'resilient install');assert(sw.includes("name.startsWith(CACHE_PREFIX) && name!==CACHE_NAME")&&sw.includes('self.clients.claim()'),'safe activate');assert(!sw.includes('caches.keys().then')||sw.includes('CACHE_PREFIX'),'unscoped delete')});
await test('fetch is limited to same-origin GET with offline navigation fallback',()=>{assert(sw.includes("request.method!=='GET'")&&sw.includes('url.origin!==self.location.origin'),'fetch boundary');assert(sw.includes("request.mode==='navigate'")&&sw.includes('networkFirst(request)'),'navigation');assert(sw.includes('staleWhileRevalidate(request,event)')&&sw.includes("['style','script','image','manifest']"),'static strategy');assert(sw.includes("cache.match(new URL('./index.html',self.registration.scope).href)"),'offline fallback')});
await test('PWA code never clears or migrates map storage',async()=>{assert(!/localStorage\s*\./.test(sw)&&!/indexedDB\s*\./.test(sw),'worker storage');const before=memory.get(key),count=writes;w.registerServiceWorker();await pause();assert(memory.get(key)===before&&writes===count,'data touched');assert(q('.main-node').textContent.includes('保存済みマップ'),'saved map missing')});
await test('normal PC and mobile app UI still boots',async()=>{assert(q('.main-node')&&q('[data-action="add-node"]')&&q('[data-action="more"]'),'core UI');frame.style.width='1200px';frame.style.height='800px';await pause(120);assert(getComputedStyle(q('.sidebar')).display!=='none','desktop');frame.style.width='390px';frame.style.height='844px';await pause(120);assert(getComputedStyle(q('.sidebar')).display==='none'&&getComputedStyle(q('.edit-tool')).display!=='none','mobile')});
document.body.dataset.done='true';
})();
</script></html>
