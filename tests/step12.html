<!doctype html><html lang="ja"><meta charset="utf-8"><title>STEP12 favorites and trash tests</title>
<style>body{font:14px system-ui}iframe{width:1200px;height:800px;border:1px solid #ddd}li{padding:4px}.fail{color:#b00020}</style>
<h1>STEP12 favorites and trash tests</h1><p>独立Storageモックでお気に入り・ゴミ箱・復元・完全削除を検証します。</p><ol id="results"></ol><iframe></iframe>
<script>
(async()=>{
const key='simple-mind-map-data',memory=new Map();let writes=0,blob=null;const now=Date.now();
const node=(id,text,parentId,x,y,color='blue')=>({id,text,parentId,x,y,color,createdAt:now,updatedAt:now});
const map=(id,title,nodes,extra={})=>({id,title,nodes,viewport:{x:id==='b'?37:0,y:id==='b'?-22:0,scale:id==='b'?1.3:1},createdAt:now,updatedAt:now,...extra});
const base={version:2,maps:[map('a','仕事',[node('ra','仕事の中心',null,400,270),node('ca','営業','ra',650,180,'green')]),map('b','勉強',[node('rb','勉強の中心',null,400,270),node('cb','英語','rb',180,170,'orange')]),map('f','毎日見る',[node('rf','お気に入り',null,400,270,'purple')],{isFavorite:true,deletedAt:null}),map('t','保管中',[node('rt','削除前の内容',null,333,222,'cyan')],{isFavorite:true,deletedAt:'2026-09-01T03:04:05.000Z'})],activeMapId:'a',updatedAt:now};
window.testStorage={getItem:k=>memory.get(k)??null,setItem(k,v){writes++;memory.set(k,v)},removeItem:k=>memory.delete(k)};
const frame=document.querySelector('iframe'),html=await(await fetch('../index.html',{cache:'no-store'})).text(),boot='<base href="'+new URL('../',location.href).href+'"><script>Object.defineProperty(window,"localStorage",{value:parent.testStorage});<\/script>';let w,d;
const pause=(ms=450)=>new Promise(r=>setTimeout(r,ms));async function reload(){await new Promise(resolve=>{frame.onload=resolve;frame.srcdoc=html.replace('<head>','<head>'+boot)});w=frame.contentWindow;d=w.document;await pause(100);w.Element.prototype.setPointerCapture=function(){};w.URL.createObjectURL=b=>{blob=b;return'blob:test'};w.URL.revokeObjectURL=()=>{};w.HTMLAnchorElement.prototype.click=function(){}};
async function reset(value=base){if(w)w.saveAppData();memory.set(key,JSON.stringify(value));await reload()}
const q=s=>d.querySelector(s),all=s=>[...d.querySelectorAll(s)],assert=(v,m)=>{if(!v)throw Error(m)},runtime=()=>w.currentBackupData(),active=()=>runtime().maps.find(m=>m.id===runtime().activeMapId),mapBy=id=>runtime().maps.find(m=>m.id===id);
const submitMap=()=>q('#map-form').dispatchEvent(new w.Event('submit',{bubbles:true,cancelable:true}));
function menu(id,action){const row=q('[data-map-id="'+id+'"]').closest('.map-row');row.querySelector('.map-more').click();q('[data-map-action="'+action+'"]').click()}
async function test(name,fn){const li=document.createElement('li');try{await fn();li.textContent='PASS '+name}catch(e){li.textContent='FAIL '+name+': '+e.message;li.className='fail'}document.querySelector('#results').append(li)}
async function importData(value){const input=q('#backup-file'),file=new w.File([JSON.stringify(value)],'maps.json',{type:'application/json'});Object.defineProperty(input,'files',{value:[file],configurable:true});input.dispatchEvent(new w.Event('change',{bubbles:true}));await pause(60);q('[data-action="confirm-import"]').click();await pause()}

await test('old and invalid fields receive safe defaults',async()=>{const old={version:2,maps:[map('old','古いマップ',[node('ro','旧',null,1,2)],{isFavorite:'yes',deletedAt:'invalid'})],activeMapId:'old',updatedAt:now};await reset(old);assert(mapBy('old').isFavorite===false&&mapBy('old').deletedAt===null,'defaults');assert(q('[data-map-id="old"]'),'not active')});
await test('favorite shows a star, sorts stably and survives reload',async()=>{await reset();assert(all('[data-map-id]').map(e=>e.dataset.mapId).join(',')==='f,a,b','initial order');menu('a','favorite');assert(q('[data-map-id="a"] .map-favorite')&&all('[data-map-id]').map(e=>e.dataset.mapId).join(',')==='a,f,b','favorite/order');await pause();await reload();assert(mapBy('a').isFavorite&&q('[data-map-id="a"] .map-favorite'),'reload');menu('a','favorite');assert(!mapBy('a').isFavorite&&all('[data-map-id]')[0].dataset.mapId==='f','remove')});
await test('favorite stays outside node history and normal tools work',async()=>{await reset();q('.node[data-node-id="ca"]').dispatchEvent(new w.KeyboardEvent('keydown',{key:'F2',bubbles:true}));q('#node-name').value='営業更新';q('#node-form').dispatchEvent(new w.Event('submit',{bubbles:true,cancelable:true}));menu('a','favorite');q('[data-action="undo"]').click();assert(q('.node[data-node-id="ca"]').textContent==='営業'&&mapBy('a').isFavorite,'history mixed');const search=q('#node-search');search.value='営業';search.dispatchEvent(new w.Event('input',{bubbles:true}));assert(q('.search-result'),'search');q('[data-map-id="b"]').click();assert(active().id==='b'&&search.value==='','switch')});
await test('normal delete only moves a complete map to trash',async()=>{await reset();const before=JSON.stringify(mapBy('b'));menu('b','delete');assert(q('#map-dialog').open&&q('#map-dialog-description').textContent.includes('保持'),'confirm');q('[data-action="cancel-map"]').click();assert(q('[data-map-id="b"]'),'cancel');menu('b','delete');submitMap();await pause();assert(!q('[data-map-id="b"]')&&mapBy('b').deletedAt,'not hidden');assert(mapBy('b').nodes.length===2&&mapBy('b').viewport.scale===1.3&&mapBy('b').isFavorite===false,'data lost');q('[data-action="trash"]').click();const row=q('[data-trash-map-id="b"]');assert(row&&row.querySelector('.trash-title').textContent==='勉強'&&row.querySelector('.trash-date').textContent.includes('削除'),'trash UI')});
await test('restore keeps ID, contents, viewport and favorite',async()=>{await reset();menu('f','delete');submitMap();q('[data-action="trash"]').click();q('[data-trash-map-id="f"] [data-trash-action="restore"]').click();const restored=mapBy('f');assert(restored&&restored.deletedAt===null&&restored.isFavorite&&restored.id==='f','state');assert(restored.nodes[0].text==='お気に入り'&&restored.viewport.scale===1,'contents');assert(q('[data-map-id="f"] .map-favorite')&&active().id==='a','list/active')});
await test('trashing active map clears selection, history and search',async()=>{await reset();q('.node[data-node-id="ca"]').click();q('[data-action="style"]').click();q('.color-option[data-color="red"]').click();const search=q('#node-search');search.value='営業';search.dispatchEvent(new w.Event('input',{bubbles:true}));menu('a','delete');submitMap();assert(active().id==='f'&&!q('.node.is-selected'),'fallback/selection');assert(q('[data-action="undo"]').disabled&&q('[data-action="redo"]').disabled,'history');assert(search.value===''&&!q('.search-result'),'search')});
await test('trashing the last normal map creates a safe root map',async()=>{const one={version:2,maps:[map('one','最後',[node('r1','最後のroot',null,400,270)])],activeMapId:'one',updatedAt:now};await reset(one);menu('one','delete');submitMap();const data=runtime(),normal=data.maps.filter(m=>m.deletedAt===null),trashed=data.maps.filter(m=>m.deletedAt!==null);assert(normal.length===1&&trashed.length===1&&data.activeMapId===normal[0].id,'fallback');assert(normal[0].nodes.length===1&&normal[0].nodes[0].parentId===null&&q('.main-node'),'root')});
await test('permanent delete requires confirmation and persists',async()=>{await reset();q('[data-action="trash"]').click();q('[data-trash-map-id="t"] [data-trash-action="permanent-delete"]').click();assert(q('#map-dialog').open&&q('#map-dialog-description').textContent.includes('元に戻せません'),'confirm');q('[data-action="cancel-map"]').click();assert(mapBy('t'),'cancel');q('[data-trash-map-id="t"] [data-trash-action="permanent-delete"]').click();submitMap();await pause();assert(!mapBy('t')&&!q('[data-trash-map-id="t"]'),'delete');await reload();assert(!mapBy('t'),'reload')});
await test('empty trash also requires confirmation',async()=>{await reset();q('[data-action="trash"]').click();q('[data-action="empty-trash"]').click();assert(q('#map-dialog').open,'confirm');q('[data-action="cancel-map"]').click();assert(runtime().maps.some(m=>m.deletedAt),'cancel');q('[data-action="empty-trash"]').click();submitMap();await pause();assert(!runtime().maps.some(m=>m.deletedAt)&&q('.trash-empty'),'empty')});
await test('JSON export and import preserve favorite and trash state',async()=>{await reset();q('[data-action="more"]').click();q('[data-backup-action="export"]').click();await pause(40);const exported=JSON.parse(await blob.text()),fav=exported.maps.find(m=>m.id==='f'),trash=exported.maps.find(m=>m.id==='t');assert(fav.isFavorite===true&&fav.deletedAt===null&&trash.isFavorite===true&&trash.deletedAt,'export');await importData(exported);assert(mapBy('f').isFavorite&&mapBy('t').deletedAt&&q('[data-map-id="f"] .map-favorite'),'import')});
await test('pre-STEP12 JSON imports as normal maps',async()=>{await reset();const old={version:2,maps:[map('legacy','従来バックアップ',[node('rl','従来root',null,400,270)])],activeMapId:'legacy',updatedAt:now};delete old.maps[0].isFavorite;delete old.maps[0].deletedAt;await importData(old);assert(active().id==='legacy'&&mapBy('legacy').isFavorite===false&&mapBy('legacy').deletedAt===null&&q('[data-map-id="legacy"]'),'legacy')});
await test('mobile drawer and trash controls stay usable',async()=>{await reset();frame.style.width='390px';frame.style.height='844px';await pause(120);q('[data-action="toggle-sidebar"]').click();assert(q('.sidebar').classList.contains('is-open'),'drawer');q('[data-action="trash"]').click();const panel=q('.trash-panel').getBoundingClientRect(),restore=q('[data-trash-map-id="t"] [data-trash-action="restore"]').getBoundingClientRect(),remove=q('[data-trash-map-id="t"] [data-trash-action="permanent-delete"]').getBoundingClientRect();assert(panel.left>=0&&panel.right<=390&&panel.bottom<=844,'bounds');assert(restore.height>=44&&remove.height>=44&&restore.right<=remove.left,'targets');q('.trash-header [data-action="close-trash"]').click();assert(q('#trash-view').hidden&&!q('.app-shell').inert,'close')});
document.body.dataset.done='true';
})();
</script></html>
