<!doctype html><html lang="ja"><meta charset="utf-8"><title>STEP6 history tests</title>
<style>body{font:14px system-ui}iframe{width:1200px;height:800px;border:1px solid #ddd}li{padding:4px}.fail{color:#b00020}</style>
<h1>STEP6 history tests</h1><p>履歴・ショートカット・保存連携を独立したStorageモックで検証します。</p><ol id="results"></ol><iframe></iframe>
<script>
(async()=>{
const key='simple-mind-map-data',memory=new Map();let writes=0,failRead=false,failWrite=false;
window.testStorage={getItem(k){if(failRead)throw Error('SecurityError');return memory.get(k)??null},setItem(k,v){if(failWrite)throw Error('QuotaExceededError');writes++;memory.set(k,v)},removeItem(k){memory.delete(k)}};
const frame=document.querySelector('iframe'),html=await (await fetch('../index.html', {cache:'no-store'})).text();
const boot='<base href="'+new URL('../',location.href).href+'"><script>Object.defineProperty(window,"localStorage",{value:parent.testStorage});<\/script>';
let w,d;
const pause=(ms=450)=>new Promise(r=>setTimeout(r,ms));
async function reload(){await new Promise(resolve=>{frame.onload=resolve;frame.srcdoc=html.replace('<head>','<head>'+boot)});w=frame.contentWindow;d=w.document;await pause(80);w.Element.prototype.setPointerCapture=function(){}};
const q=s=>d.querySelector(s),node=id=>q('[data-node-id="'+id+'"]'),saved=()=>{const data=JSON.parse(memory.get(key));if(data.version!==2)return data;const map=data.maps.find(m=>m.id===data.activeMapId);return {...map,version:1}};
const assert=(v,m)=>{if(!v)throw Error(m)};
const box=e=>{const r=e.getBoundingClientRect();return {x:r.x+r.width/2,y:r.y+r.height/2}};
const pointer=(e,type,id,x,y)=>e.dispatchEvent(new w.PointerEvent(type,{bubbles:true,cancelable:true,pointerId:id,clientX:x,clientY:y,button:0,pointerType:'touch',isPrimary:id===1}));
function click(e){if(typeof e==='string')e=q(e);const b=box(e);pointer(e,'pointerdown',1,b.x,b.y);pointer(e,'pointerup',1,b.x,b.y);e.dispatchEvent(new w.MouseEvent('click',{bubbles:true,detail:1}))}
const submit=text=>{q('#node-name').value=text;q('#node-form').dispatchEvent(new w.Event('submit',{bubbles:true,cancelable:true}))};
async function test(name,fn){const li=document.createElement('li');try{await fn();li.textContent='PASS '+name}catch(e){li.textContent='FAIL '+name+': '+e.message;li.className='fail'}document.querySelector('#results').append(li)}

const keypress=(key,options={})=>{const event=new w.KeyboardEvent('keydown',{bubbles:true,cancelable:true,key,...options});d.body.dispatchEvent(event);return event};
const ids=()=>[...d.querySelectorAll('.node')].map(e=>e.dataset.nodeId).join(',');
const edit=(id,text)=>{node(id).dispatchEvent(new w.KeyboardEvent('keydown',{bubbles:true,key:'F2'}));submit(text)};
await test('empty history and add Undo/Redo restores exact data',async()=>{await reload();await pause();assert(q('[data-action="undo"]').disabled&&q('[data-action="redo"]').disabled,'initial buttons');click('#quick-add');submit('履歴テスト');await pause();const added=saved().nodes.find(n=>n.id==='node-1');click('[data-action="undo"]');assert(!node('node-1')&&q('[data-action="undo"]').disabled,'undo add');click('[data-action="redo"]');await pause();assert(JSON.stringify(saved().nodes.find(n=>n.id==='node-1'))===JSON.stringify(added),'redo data mismatch');assert(d.querySelectorAll('.node.is-selected').length===0,'selection')});
await test('edit/root title Undo and Redo; deep copies survive changes',async()=>{edit('root','変更後のroot');await pause(20);click('[data-action="undo"]');assert(q('h1').textContent==='マイマップ','root undo');click('[data-action="redo"]');assert(q('h1').textContent==='マイマップ','root redo');edit('work','新規事業');await pause(20);click('[data-action="undo"]');assert(node('work').textContent==='仕事','edit undo');click('[data-action="redo"]');assert(node('work').textContent==='新規事業','edit redo')});
await test('subtree deletion restores descendants, positions, colors and lines',async()=>{click(node('work'));click('#quick-add');submit('営業');await pause(20);click('#quick-add');submit('新規顧客');await pause();const before=JSON.stringify(saved().nodes);click(node('work'));click('[data-action="delete-node"]');click('[data-action="confirm-delete"]');await pause(20);assert(!node('work')&&!node('node-2')&&!node('node-3'),'subtree delete');click('[data-action="undo"]');await pause();assert(JSON.stringify(saved().nodes)===before,'subtree data');assert(d.querySelectorAll('.connections path').length===d.querySelectorAll('.node').length-1,'lines');click('[data-action="redo"]');assert(!node('work')&&!node('node-3'),'redo delete')});
await test('one drag with 30 moves is one history item; viewport unchanged',async()=>{await pause();await reload();const e=node('study'),b=box(e),before=e.style.cssText;pointer(e,'pointerdown',1,b.x,b.y);for(let i=1;i<=30;i++)pointer(e,'pointermove',1,b.x+i,b.y+i);pointer(e,'pointerup',1,b.x+30,b.y+30);const after=e.style.cssText;click('[data-action="zoom-in"]');const transform=q('#mindMapWorld').style.transform;click('[data-action="undo"]');assert(node('study').style.cssText===before,'drag undo');assert(q('[data-action="undo"]').disabled,'multiple drag histories');assert(q('#mindMapWorld').style.transform===transform,'viewport undone');click('[data-action="redo"]');assert(node('study').style.cssText===after,'drag redo')});
await test('Ctrl/Cmd shortcuts and Ctrl+Y',async()=>{for(const options of [{ctrlKey:true},{metaKey:true}]){assert(keypress('z',options).defaultPrevented,'shortcut default');assert(!q('[data-action="redo"]').disabled,'shortcut undo');keypress('z',{...options,shiftKey:true});assert(q('[data-action="redo"]').disabled,'shift redo')}keypress('z',{ctrlKey:true});keypress('y',{ctrlKey:true});assert(q('[data-action="redo"]').disabled,'ctrl y')});
await test('input Undo untouched; empty and unchanged edits preserve Redo',async()=>{keypress('z',{ctrlKey:true});const before=ids();node('study').dispatchEvent(new w.KeyboardEvent('keydown',{bubbles:true,key:'F2'}));const event=new w.KeyboardEvent('keydown',{bubbles:true,cancelable:true,key:'z',ctrlKey:true});q('#node-name').dispatchEvent(event);assert(!event.defaultPrevented&&ids()===before,'input intercepted');submit(' ');click('[data-action="cancel-edit"]');await pause(20);edit('study',node('study').textContent);await pause(20);assert(!q('[data-action="redo"]').disabled,'noop cleared redo');click('[data-action="redo"]')});
await test('new operation after Undo clears Redo; pan and taps add no history',async()=>{keypress('z',{ctrlKey:true});edit('study','別の操作');await pause(20);assert(q('[data-action="redo"]').disabled,'redo retained');await pause();await reload();const c=q('.canvas');pointer(c,'pointerdown',1,300,150);pointer(c,'pointermove',1,350,170);pointer(c,'pointerup',1,350,170);click(node('root'));assert(q('[data-action="undo"]').disabled,'pan or tap history')});
await test('50 entry limit for undo and redo',async()=>{for(let i=1;i<=55;i++){edit('root','履歴'+i);await pause(1)}let count=0;while(!q('[data-action="undo"]').disabled&&count<60){click('[data-action="undo"]');count++}assert(count===50&&node('root').textContent==='履歴5','undo limit');count=0;while(!q('[data-action="redo"]').disabled&&count<60){click('[data-action="redo"]');count++}assert(count===50&&node('root').textContent==='履歴55','redo limit')});
await test('Undo/Redo autosave and reload clears only history',async()=>{click('[data-action="undo"]');await pause();await reload();assert(node('root').textContent==='履歴54','undo not saved');assert(q('[data-action="undo"]').disabled&&q('[data-action="redo"]').disabled,'history persisted');edit('root','Redo保存');await pause(20);click('[data-action="undo"]');click('[data-action="redo"]');await pause();await reload();assert(node('root').textContent==='Redo保存','redo not saved')});
await test('invalid root snapshot rejected before mutation; mobile buttons fit',async()=>{const before=ids();let rejected=false;try{w.restoreHistorySnapshot({nodes:[]})}catch(e){rejected=true}assert(rejected&&ids()===before,'root removed');frame.style.width='320px';frame.style.height='568px';await pause(100);for(const action of ['undo','redo']){const r=q('[data-action="'+action+'"]').getBoundingClientRect();assert(r.width>=44&&r.height>=44,'mobile history hidden')}assert(d.documentElement.scrollWidth===320,'mobile overflow')});
document.body.dataset.done='true';
})();
</script></html>
