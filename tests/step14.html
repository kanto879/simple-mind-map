<!doctype html><html lang="ja"><meta charset="utf-8"><title>STEP14 mobile polish tests</title>
<style>body{font:14px system-ui}iframe{width:390px;height:844px;border:1px solid #ddd}li{padding:4px}.fail{color:#b00020}</style>
<h1>STEP14 mobile polish tests</h1><p>320〜768px、ドロワー、主要操作、ジェスチャー、横画面、PC回帰を検証します。</p><ol id="results"></ol><iframe></iframe>
<script>
(async()=>{
const frame=document.querySelector('iframe'),now=Date.now(),key='simple-mind-map-data',memory=new Map();
const maps=Array.from({length:18},(_,i)=>({id:'map-'+i,title:i?'マップ '+i:'とても長い日本語のマインドマップタイトルを省略表示する確認',nodes:[{id:'root-'+i,text:i?'中心 '+i:'新しいアイデア',parentId:null,x:400,y:270,color:'blue',createdAt:now,updatedAt:now},{id:'child-'+i,text:'子ノード',parentId:'root-'+i,x:620,y:180,color:'green',createdAt:now,updatedAt:now}],viewport:{x:0,y:0,scale:1},createdAt:now,updatedAt:now,isFavorite:i===2,deletedAt:null}));
memory.set(key,JSON.stringify({version:2,maps,activeMapId:'map-0',updatedAt:now}));
window.testStorage={getItem:k=>memory.get(k)??null,setItem:(k,v)=>memory.set(k,v),removeItem:k=>memory.delete(k)};
const html=await(await fetch('../index.html',{cache:'no-store'})).text(),boot='<base href="'+new URL('../',location.href).href+'"><script>Object.defineProperty(window,"localStorage",{value:parent.testStorage});<\/script>';let w,d;
await new Promise(resolve=>{frame.onload=resolve;frame.srcdoc=html.replace('<head>','<head>'+boot)});w=frame.contentWindow;d=w.document;await new Promise(r=>setTimeout(r,150));w.Element.prototype.setPointerCapture=function(){};
const q=s=>d.querySelector(s),all=s=>[...d.querySelectorAll(s)],pause=(ms=100)=>new Promise(r=>setTimeout(r,ms));
const assert=(v,m)=>{if(!v)throw Error(m)},rect=e=>e.getBoundingClientRect(),overlap=(a,b)=>a.left<b.right&&a.right>b.left&&a.top<b.bottom&&a.bottom>b.top;
const pointer=(target,type,id,x,y)=>target.dispatchEvent(new w.PointerEvent(type,{bubbles:true,cancelable:true,pointerId:id,clientX:x,clientY:y,button:0,buttons:type==='pointerup'?0:1,pointerType:'touch',isPrimary:id===1}));
async function size(width,height){frame.style.width=width+'px';frame.style.height=height+'px';await pause(140)}
async function test(name,fn){const li=document.createElement('li');try{await fn();li.textContent='PASS '+name}catch(e){li.textContent='FAIL '+name+': '+e.message;li.className='fail'}document.querySelector('#results').append(li)}

await test('viewport keeps browser zoom accessible and enables safe areas',()=>{const value=d.querySelector('meta[name="viewport"]').content;assert(value.includes('width=device-width')&&value.includes('initial-scale=1')&&value.includes('viewport-fit=cover'),'viewport');assert(!value.includes('user-scalable=no')&&!value.includes('maximum-scale'),'zoom disabled')});
await test('320–768px layouts have no horizontal overflow and 44px header targets',async()=>{for(const width of [320,360,375,390,430,768]){await size(width,Math.max(568,Math.round(width*1.8)));assert(d.documentElement.scrollWidth<=width,'overflow '+width);for(const button of all('.header .icon-button').filter(e=>getComputedStyle(e).display!=='none')){const r=rect(button);assert(r.width>=44&&r.height>=44&&r.left>=0&&r.right<=width+.5,'header '+width)}}});
await test('mobile toolbar prioritizes five actions and does not overlap quick add',async()=>{await size(320,568);const visible=all('.bottom-toolbar .tool-button').filter(e=>getComputedStyle(e).display!=='none');assert(visible.map(e=>e.dataset.action).join(',')==='add-node,edit-node,style,delete-node,auto-layout','actions');visible.forEach(button=>assert(rect(button).height>=52,'tap target'));assert(!overlap(rect(q('.bottom-toolbar')),rect(q('.quick-add'))),'quick overlap');assert(rect(q('.bottom-toolbar')).right<=320&&rect(q('.bottom-toolbar')).left>=0,'toolbar bounds')});
await test('drawer is bounded, scrollable, inert-safe and closes from overlay',async()=>{await size(390,700);q('[data-action="toggle-sidebar"]').click();const drawer=q('.sidebar'),list=q('.map-list');assert(drawer.classList.contains('is-open')&&rect(drawer).width<=320&&rect(drawer).width<=390*.84+.5,'drawer width');assert(q('.workspace').inert&&!q('#drawer-overlay').hidden,'background');assert(list.scrollHeight>list.clientHeight&&['auto','scroll'].includes(getComputedStyle(list).overflowY),'scroll');q('#drawer-overlay').click();assert(!drawer.classList.contains('is-open')&&!q('.workspace').inert&&q('#drawer-overlay').hidden,'close')});
await test('map and export menus stay inside small screens with large targets',async()=>{await size(320,568);q('[data-action="toggle-sidebar"]').click();q('.map-more').click();let menu=rect(q('#map-menu'));assert(menu.left>=0&&menu.right<=320&&menu.bottom<=568,'map menu');all('#map-menu button').forEach(e=>assert(rect(e).height>=48,'map action'));d.body.click();q('#drawer-overlay').click();q('[data-action="more"]').click();menu=rect(q('#backup-menu'));assert(menu.left>=0&&menu.right<=320&&menu.bottom<=568,'export menu');all('#backup-menu button').forEach(e=>assert(rect(e).height>=48,'export action'));d.body.click()});
await test('explicit mobile edit opens a keyboard-safe dialog',async()=>{await size(375,667);q('[data-node-id="child-0"]').click();const edit=q('[data-action="edit-node"]');assert(!edit.disabled&&getComputedStyle(edit).display!=='none','edit unavailable');edit.click();await pause(30);const dialog=rect(q('#node-editor'));assert(q('#node-editor').open&&dialog.left>=0&&dialog.right<=375&&dialog.bottom<=667,'dialog bounds');assert(parseFloat(getComputedStyle(q('#node-name')).fontSize)>=16,'input zoom');q('[data-action="cancel-edit"]').click()});
await test('color palette and mobile search remain usable',async()=>{w.selectNode(null);q('[data-node-id="child-0"]').click();q('[data-action="style"]').click();let panel=rect(q('#color-palette'));assert(panel.left>=0&&panel.right<=375&&panel.bottom<=667,'palette');all('.color-option').forEach(e=>assert(rect(e).height>=48,'color target'));q('[data-action="close-colors"]').click();q('[data-action="open-search"]').click();assert(!q('#mobile-search').hidden&&parseFloat(getComputedStyle(q('#mobile-node-search')).fontSize)>=16,'search');assert(rect(q('[data-action="close-search"]')).width>=44,'search close');q('#mobile-node-search').value='子';q('#mobile-node-search').dispatchEvent(new w.Event('input',{bubbles:true}));assert(q('#mobile-search-results .search-result')&&rect(q('#mobile-search-results')).right<=375,'results');q('[data-action="close-search"]').click()});
await test('node drag and background pan remain separate',async()=>{await size(390,700);const node=q('[data-node-id="child-0"]'),canvas=q('.canvas'),nr=rect(node),transform=q('#mindMapWorld').style.transform;pointer(node,'pointerdown',1,nr.x+nr.width/2,nr.y+nr.height/2);pointer(node,'pointermove',1,nr.x+nr.width/2+30,nr.y+nr.height/2+20);assert(q('#mindMapWorld').style.transform===transform,'node moved world');pointer(node,'pointerup',1,nr.x+nr.width/2+30,nr.y+nr.height/2+20);const nodeStyle=node.style.cssText;pointer(canvas,'pointerdown',1,100,100);pointer(canvas,'pointermove',1,130,125);assert(node.style.cssText===nodeStyle&&q('#mindMapWorld').style.transform!==transform,'pan conflict');pointer(canvas,'pointerup',1,130,125)});
await test('pinch interrupts node movement and ignores the remaining finger',async()=>{const node=q('[data-node-id="child-0"]'),canvas=q('.canvas'),r=rect(node),styles=all('.node').map(e=>e.style.cssText);pointer(node,'pointerdown',1,r.x+r.width/2-20,r.y+r.height/2);pointer(canvas,'pointerdown',2,r.x+r.width/2+20,r.y+r.height/2);pointer(canvas,'pointermove',2,r.x+r.width/2+70,r.y+r.height/2);assert(all('.node').every((e,i)=>e.style.cssText===styles[i]),'pinch moved node');pointer(canvas,'pointerup',2,r.x+r.width/2+70,r.y+r.height/2);const transform=q('#mindMapWorld').style.transform;pointer(node,'pointermove',1,r.x+r.width/2+100,r.y+r.height/2);assert(q('#mindMapWorld').style.transform===transform,'remaining finger');pointer(node,'pointerup',1,r.x+r.width/2+100,r.y+r.height/2)});
await test('landscape controls stay usable and resize preserves viewport',async()=>{const before=q('#mindMapWorld').style.transform;await size(844,390);const toolbar=rect(q('.bottom-toolbar')),quick=rect(q('.quick-add')),zoom=rect(q('.zoom-controls'));assert(toolbar.left>=0&&toolbar.right<=844&&toolbar.bottom<=390,`landscape toolbar ${JSON.stringify({left:toolbar.left,right:toolbar.right,bottom:toolbar.bottom,height:toolbar.height})}`);assert(!overlap(toolbar,quick)&&!overlap(toolbar,zoom)&&!overlap(quick,zoom),'landscape overlap');assert(q('#mindMapWorld').style.transform===before,'viewport reset');await size(390,844);assert(q('#mindMapWorld').style.transform===before,'portrait reset')});
await test('desktop layout keeps the original controls',async()=>{await size(1200,800);assert(getComputedStyle(q('.sidebar')).display!=='none'&&getComputedStyle(q('.edit-tool')).display==='none','desktop layout');assert(getComputedStyle(q('.icon-tool')).display!=='none'&&getComputedStyle(q('.note-tool')).display!=='none','desktop tools');assert(rect(q('.header')).height===80,'desktop header')});
await size(390,844);
document.body.dataset.done='true';
})();
</script></html>
