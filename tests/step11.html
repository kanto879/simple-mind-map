<!doctype html><html lang="ja"><meta charset="utf-8"><title>STEP11 auto layout tests</title>
<style>body{font:14px system-ui}iframe{width:1200px;height:800px;border:1px solid #ddd}li{padding:4px}.fail{color:#b00020}</style>
<h1>STEP11 auto layout tests</h1><p>独立Storageモックで配置・履歴・保存・既存操作を検証します。</p><ol id="results"></ol><iframe></iframe>
<script>
(async()=>{
const key='simple-mind-map-data',memory=new Map();let writes=0,blob=null;const now=Date.now();
const node=(id,text,parentId,x,y,color='blue')=>({id,text,parentId,x,y,color,createdAt:now,updatedAt:now});
const tree=[node('r','中心',null,460,310),node('c1','左の大枝','r',460,310,'blue'),node('c1a','深い枝','c1',460,310,'green'),node('c1a1','三階層','c1a',460,310,'orange'),node('c1b','兄弟','c1',460,310,'purple'),node('c2','左2','r',460,310,'cyan'),node('c3','左3','r',460,310,'red'),node('c4','右の大枝','r',460,310,'yellow'),node('c4a','右A','c4',460,310,'gray'),node('c4b','右B','c4',460,310,'blue'),node('c4c','右C','c4',460,310,'green'),node('c5','右2','r',460,310,'orange'),node('c6','右3','r',460,310,'purple')];
const data={version:2,maps:[{id:'a',title:'A',nodes:tree,viewport:{x:0,y:0,scale:1},createdAt:now,updatedAt:now},{id:'b',title:'B',nodes:[node('rb','別マップ',null,310,220),node('cb','その子','rb',90,90)],viewport:{x:13,y:17,scale:1.1},createdAt:now,updatedAt:now},{id:'only',title:'Root only',nodes:[node('ro','ひとつ',null,90,90)],viewport:{x:0,y:0,scale:1},createdAt:now,updatedAt:now}],activeMapId:'a',updatedAt:now};memory.set(key,JSON.stringify(data));
window.testStorage={getItem:k=>memory.get(k)??null,setItem(k,v){writes++;memory.set(k,v)},removeItem:k=>memory.delete(k)};
const frame=document.querySelector('iframe'),html=await(await fetch('../index.html',{cache:'no-store'})).text(),boot='<base href="'+new URL('../',location.href).href+'"><script>Object.defineProperty(window,"localStorage",{value:parent.testStorage});<\/script>';let w,d;
const pause=(ms=450)=>new Promise(r=>setTimeout(r,ms));async function reload(){await new Promise(resolve=>{frame.onload=resolve;frame.srcdoc=html.replace('<head>','<head>'+boot)});w=frame.contentWindow;d=w.document;await pause(100);w.Element.prototype.setPointerCapture=function(){};w.URL.createObjectURL=b=>{blob=b;return'blob:test'};w.URL.revokeObjectURL=()=>{};w.HTMLAnchorElement.prototype.click=function(){}}await reload();
const q=s=>d.querySelector(s),assert=(v,m)=>{if(!v)throw Error(m)},saved=()=>JSON.parse(memory.get(key)),active=()=>saved().maps.find(m=>m.id===saved().activeMapId),runtime=()=>{const value=w.currentBackupData();return value.maps.find(m=>m.id===value.activeMapId)},positions=list=>Object.fromEntries(list.map(n=>[n.id,[n.x,n.y]]));
async function test(name,fn){const li=document.createElement('li');try{await fn();li.textContent='PASS '+name}catch(e){li.textContent='FAIL '+name+': '+e.message;li.className='fail'}document.querySelector('#results').append(li)}
const center=e=>{const r=e.getBoundingClientRect();return{x:r.x+r.width/2,y:r.y+r.height/2}},pointer=(e,type,id,x,y)=>e.dispatchEvent(new w.PointerEvent(type,{bubbles:true,cancelable:true,pointerId:id,clientX:x,clientY:y,button:0,pointerType:'touch',isPrimary:id===1}));
const stripPosition=list=>list.map(({id,text,parentId,color})=>({id,text,parentId,color}));
const original=positions(data.maps[0].nodes),originalShape=JSON.stringify(stripPosition(data.maps[0].nodes));let arranged;
await test('three children are split around a centered root',()=>{const sample=[node('x','x',null,1,1),node('a','a','x',1,1),node('b','b','x',1,1),node('c','c','x',1,1)],p=w.calculateAutoLayout(sample);assert(p.get('x').x===400&&p.get('x').y===250,'root');assert([...p.values()].filter(v=>v.x<400).length===1&&[...p.values()].filter(v=>v.x>400).length===2,'split')});
await test('six branches balance and descendants extend outward',()=>{const p=w.calculateAutoLayout(tree),first=tree.filter(n=>n.parentId==='r');assert(first.filter(n=>p.get(n.id).x<400).length===3&&first.filter(n=>p.get(n.id).x>400).length===3,'balance');assert(p.get('c1a').x<p.get('c1').x&&p.get('c1a1').x<p.get('c1a').x&&p.get('c4a').x>p.get('c4').x,'depth');const sameDepth=['c1','c2','c3'].map(id=>p.get(id).y);assert(new Set(sameDepth).size===3&&Math.min(...sameDepth.map((y,i)=>Math.abs(y-sameDepth[(i+1)%3]))), 'spacing')});
await test('invalid trees stop safely without mutation',()=>{const broken=[node('z','z',null,1,1),node('a','a','b',2,2),node('b','b','a',3,3)];assert(w.calculateAutoLayout(broken)===null&&broken[0].x===1,'cycle');assert(w.calculateAutoLayout([])===null,'empty')});
await test('button arranges only coordinates, redraws lines and fits view',()=>{q('[data-action="auto-layout"]').click();const current=runtime().nodes;arranged=positions(current);assert(current.find(n=>n.id==='r').x===400&&current.find(n=>n.id==='r').y===250,'button/root');assert(JSON.stringify(stripPosition(current))===originalShape,'structure/color changed');const rects=[...d.querySelectorAll('.node')].map(e=>e.getBoundingClientRect());for(let i=0;i<rects.length;i++)for(let j=i+1;j<rects.length;j++)assert(!(rects[i].left<rects[j].right&&rects[i].right>rects[j].left&&rects[i].top<rects[j].bottom&&rects[i].bottom>rects[j].top),'overlap');assert(q('.connections').children.length===tree.length-1,'lines');assert(q('#node-notice').textContent.includes('自動整理'),'notice');assert(q('.zoom-value').textContent!=='100%','fit')});
await test('one layout is one Undo and same layout adds no history',()=>{q('[data-action="undo"]').click();assert(JSON.stringify(positions(runtime().nodes))===JSON.stringify(original),'undo');q('[data-action="redo"]').click();assert(JSON.stringify(positions(runtime().nodes))===JSON.stringify(arranged),'redo');q('[data-action="auto-layout"]').click();q('[data-action="undo"]').click();assert(JSON.stringify(positions(runtime().nodes))===JSON.stringify(original),'duplicate history');q('[data-action="redo"]').click()});
await test('layout autosaves, reloads and stays map-specific',async()=>{await pause();const a=positions(active().nodes),b=positions(saved().maps.find(m=>m.id==='b').nodes);assert(JSON.stringify(a)===JSON.stringify(arranged),'save');await reload();assert(JSON.stringify(positions(active().nodes))===JSON.stringify(arranged),'reload');q('[data-map-id="b"]').click();assert(JSON.stringify(positions(runtime().nodes))===JSON.stringify(b),'map B changed');q('[data-map-id="a"]').click()});
await test('nodes remain draggable and connections follow',()=>{const el=q('.node[data-node-id="c2"]'),before=el.style.left,p=center(el);pointer(el,'pointerdown',1,p.x,p.y);pointer(el,'pointermove',1,p.x+30,p.y+18);pointer(el,'pointerup',1,p.x+30,p.y+18);assert(el.style.left!==before&&q('.connections').children.length===tree.length-1,'drag')});
await test('add, delete and color tools still work',async()=>{q('.node[data-node-id="c3"]').click();q('[data-action="add-node"]').click();q('#node-name').value='追加確認';q('#node-form').dispatchEvent(new w.Event('submit',{bubbles:true,cancelable:true}));await pause(50);const added=[...d.querySelectorAll('.node')].find(e=>e.textContent.includes('追加確認'));assert(added,'add');q('[data-action="style"]').click();q('.color-option[data-color="gray"]').click();assert([...d.querySelectorAll('.node')].find(e=>e.textContent.includes('追加確認')).dataset.color==='gray','color');q('[data-action="delete-node"]').click();q('[data-action="confirm-delete"]').click();assert(![...d.querySelectorAll('.node')].some(e=>e.textContent.includes('追加確認')),'delete')});
await test('search and centerOnNode work after layout',()=>{const input=q('#node-search');input.value='三階層';input.dispatchEvent(new w.Event('input',{bubbles:true}));assert(q('.node[data-node-id="c1a1"]').classList.contains('is-search-match'),'search');q('.search-result[data-node-id="c1a1"]').click();assert(q('.node[data-node-id="c1a1"]').classList.contains('is-selected'),'center/select');input.value='';input.dispatchEvent(new w.Event('input',{bubbles:true}))});
await test('JSON export and import preserve arranged positions',async()=>{q('[data-action="auto-layout"]').click();q('[data-action="more"]').click();q('[data-backup-action="export"]').click();await pause(30);const exported=JSON.parse(await blob.text()),expected=positions(exported.maps.find(m=>m.id==='a').nodes),input=q('#backup-file'),file=new w.File([JSON.stringify(exported)],'layout.json',{type:'application/json'});Object.defineProperty(input,'files',{value:[file],configurable:true});input.dispatchEvent(new w.Event('change',{bubbles:true}));await pause(50);q('[data-action="confirm-import"]').click();assert(JSON.stringify(positions(active().nodes))===JSON.stringify(expected),'backup')});
await test('root-only map arranges safely',()=>{q('[data-map-id="only"]').click();q('[data-action="auto-layout"]').click();assert(q('.node').dataset.nodeId==='ro'&&q('.node').style.left==='50%','root only')});
await test('mobile action has a large target and gestures still work',async()=>{q('[data-map-id="a"]').click();frame.style.width='390px';frame.style.height='844px';await pause(120);const button=q('[data-action="auto-layout"]'),br=button.getBoundingClientRect();assert(br.height>=44&&br.left>=0&&br.right<=390,'button bounds');button.click();const child=q('.node[data-node-id="c5"]'),p=center(child),left=child.style.left;pointer(child,'pointerdown',1,p.x,p.y);pointer(child,'pointermove',1,p.x+18,p.y+12);pointer(child,'pointerup',1,p.x+18,p.y+12);assert(child.style.left!==left,'mobile drag');const canvas=q('#mindmap-canvas'),c=center(canvas),transform=q('#mindMapWorld').style.transform;pointer(canvas,'pointerdown',2,c.x,c.y);pointer(canvas,'pointermove',2,c.x+18,c.y);pointer(canvas,'pointerup',2,c.x+18,c.y);assert(q('#mindMapWorld').style.transform!==transform,'mobile pan');const before=q('.zoom-value').textContent;pointer(canvas,'pointerdown',3,c.x-30,c.y);pointer(canvas,'pointerdown',4,c.x+30,c.y);pointer(canvas,'pointermove',3,c.x-55,c.y);pointer(canvas,'pointermove',4,c.x+55,c.y);pointer(canvas,'pointerup',3,c.x-55,c.y);pointer(canvas,'pointerup',4,c.x+55,c.y);assert(q('.zoom-value').textContent!==before,'pinch')});
document.body.dataset.done='true';
})();
</script></html>
