<!doctype html><html lang="ja"><meta charset="utf-8"><title>STEP13 PNG and PDF export tests</title>
<style>body{font:14px system-ui}iframe{width:1200px;height:800px;border:1px solid #ddd}li{padding:4px}.fail{color:#b00020}</style>
<h1>STEP13 PNG and PDF export tests</h1><p>全体bounds、Canvas描画、PNG/PDF、状態保護、巨大マップ、スマホUIを検証します。</p><ol id="results"></ol><iframe></iframe>
<script>
(async()=>{
const key='simple-mind-map-data',memory=new Map(),now=Date.now();let downloads=[];
const node=(id,text,parentId,x,y,color='blue',icon)=>({id,text,parentId,x,y,color,icon,createdAt:now,updatedAt:now,moved:true});
const map={id:'map-export',title:'仕事/計画:*?',nodes:[node('root','新しいアイデア',null,400,270,'blue'),node('left','画面外の勉強','root',-650,100,'green','book'),node('right','旅行プラン','root',1550,430,'orange','plane'),node('bottom','日本語ノード','right',1550,900,'purple')],viewport:{x:9876,y:-4321,scale:.4},createdAt:now,updatedAt:now,isFavorite:false,deletedAt:null};
const base={version:2,maps:[map],activeMapId:map.id,updatedAt:now};
window.testStorage={getItem:k=>memory.get(k)??null,setItem(k,v){memory.set(k,v)},removeItem:k=>memory.delete(k)};
const frame=document.querySelector('iframe'),html=await(await fetch('../index.html',{cache:'no-store'})).text(),boot='<base href="'+new URL('../',location.href).href+'"><script>Object.defineProperty(window,"localStorage",{value:parent.testStorage});<\/script>';let w,d;
const pause=(ms=250)=>new Promise(r=>setTimeout(r,ms));
async function reload(){await new Promise(resolve=>{frame.onload=resolve;frame.srcdoc=html.replace('<head>','<head>'+boot)});w=frame.contentWindow;d=w.document;await pause(100);w.Element.prototype.setPointerCapture=function(){};downloads=[];w.downloadBlob=(blob,name)=>downloads.push({blob,name})}
async function reset(){if(w)w.saveAppData();memory.set(key,JSON.stringify(base));await reload()}
const q=s=>d.querySelector(s),assert=(v,m)=>{if(!v)throw Error(m)};
async function test(name,fn){const li=document.createElement('li');try{await fn();li.textContent='PASS '+name}catch(e){li.textContent='FAIL '+name+': '+e.message;li.className='fail'}document.querySelector('#results').append(li)}

await test('bounds contain every node plus padding',async()=>{await reset();const bounds=w.getMapExportBounds(w.getActiveMap().nodes);assert(bounds.left===-790&&bounds.right===1690,'horizontal bounds');assert(bounds.top===-7.5&&bounds.bottom===1007.5,'vertical bounds')});
await test('canvas contains the whole map independent of viewport',async()=>{await reset();const before=q('#mindMapWorld').style.transform,result=await w.createMapCanvas(w.getActiveMap());assert(result.canvas.width>4000&&result.canvas.height>1900,'canvas size');assert(result.bounds.left< -700&&result.bounds.right>1600,'offscreen nodes');assert(q('#mindMapWorld').style.transform===before,'viewport changed')});
await test('canvas draws node colors, connections and Japanese text safely',async()=>{await reset();const result=await w.createMapCanvas(w.getActiveMap()),ctx=result.canvas.getContext('2d'),pixels=ctx.getImageData(0,0,result.canvas.width,result.canvas.height).data;let nonWhite=0,greenish=0;for(let i=0;i<pixels.length;i+=4){if(pixels[i]<245||pixels[i+1]<245||pixels[i+2]<245)nonWhite++;if(pixels[i+1]>pixels[i]&&pixels[i+1]>pixels[i+2])greenish++}assert(nonWhite>10000,'drawing missing');assert(greenish>100,'color/line missing')});
await test('selection and search highlights are excluded and state stays intact',async()=>{await reset();q('[data-node-id="right"]').click();const search=q('#node-search');search.value='旅行';search.dispatchEvent(new w.Event('input',{bubbles:true}));const transform=q('#mindMapWorld').style.transform;await w.createMapCanvas(w.getActiveMap());assert(q('.node.is-selected')?.dataset.nodeId==='right'&&search.value==='旅行'&&q('#mindMapWorld').style.transform===transform,'UI state changed');assert(q('.node.is-search-match'),'test state missing')});
await test('PNG export downloads a safe dated filename',async()=>{await reset();const ok=await w.exportCurrentMap('png');assert(ok&&downloads.length===1,'download');assert(downloads[0].blob.type==='image/png','mime');assert(/^simple-mind-map-仕事-計画----\d{4}-\d{2}-\d{2}\.png$/.test(downloads[0].name),'filename: '+downloads[0].name)});
await test('PDF is a valid one-page image PDF with automatic landscape',async()=>{await reset();const ok=await w.exportCurrentMap('pdf'),item=downloads[0],text=await item.blob.slice(0,500).text();assert(ok&&item.blob.type==='application/pdf'&&text.startsWith('%PDF-1.4'),'pdf header');assert(text.includes('/MediaBox [0 0 841.89 595.28]'),'landscape');assert(item.name.endsWith('.pdf'),'filename')});
await test('portrait PDF selects portrait and keeps an image page',async()=>{await reset();const bytes=new Uint8Array([255,216,255,217]),pdf=w.jpegPdfBlob(bytes,300,900),text=await pdf.text();assert(text.includes('/MediaBox [0 0 595.28 841.89]')&&text.includes('/Subtype /Image'),'portrait/image')});
await test('large maps stay within canvas limits',async()=>{await reset();const large=[];for(let i=0;i<100;i++)large.push(node(i?'n'+i:'root','ノード'+i,i?'root':null,(i%10)*1400,Math.floor(i/10)*1100,i%2?'red':'cyan'));const bounds=w.getMapExportBounds(large),scale=w.exportRenderScale(bounds);assert(bounds.width>12000&&scale<1,'not reduced');assert(bounds.width*scale<=8192.01&&bounds.height*scale<=8192.01&&bounds.width*bounds.height*scale*scale<=24000001,'unsafe canvas')});
await test('concurrent export is blocked and failure restores buttons',async()=>{await reset();const original=w.createMapCanvas;let release;w.createMapCanvas=()=>new Promise(resolve=>release=()=>resolve(original(w.getActiveMap())));const first=w.exportCurrentMap('png'),second=await w.exportCurrentMap('png');assert(second===false&&q('[data-export-action="png"]').disabled,'not locked');release();await first;w.createMapCanvas=async()=>{throw Error('test failure')};const failed=await w.exportCurrentMap('png');assert(failed===false&&!q('[data-export-action="png"]').disabled&&q('#backup-menu').getAttribute('aria-busy')==='false','not restored')});
await test('desktop and mobile menus expose 44px PNG/PDF actions',async()=>{await reset();q('[data-action="more"]').click();assert(!q('#backup-menu').hidden&&q('[data-export-action="png"]')&&q('[data-export-action="pdf"]'),'desktop menu');frame.style.width='390px';frame.style.height='844px';await pause(120);q('[data-action="more"]').click();if(q('#backup-menu').hidden)q('[data-action="more"]').click();const menu=q('#backup-menu').getBoundingClientRect(),png=q('[data-export-action="png"]').getBoundingClientRect(),pdf=q('[data-export-action="pdf"]').getBoundingClientRect();assert(menu.left>=0&&menu.right<=390&&menu.bottom<=844,'mobile bounds');assert(png.height>=44&&pdf.height>=44,'tap size')});
document.body.dataset.done='true';
})();
</script></html>
