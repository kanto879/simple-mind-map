<!doctype html><html lang="ja"><meta charset="utf-8"><title>STEP9 backup tests</title>
<style>body{font:14px system-ui}iframe{width:1200px;height:800px;border:1px solid #ddd}li{padding:4px}.fail{color:#b00020}</style>
<h1>STEP9 backup tests</h1><p>実際の保存領域に触れないStorageモックで書き出し・復元・失敗時保護を検証します。</p><ol id="results"></ol><iframe></iframe>
<script>
(async()=>{
const key='simple-mind-map-data',memory=new Map();let writes=0,failWrite=false,capturedBlob=null,downloadName='',revoked=false;
const now=Date.now(),node=(id,text,parentId,x,y)=>({id,text,parentId,x,y,color:'blue',createdAt:now,updatedAt:now});
const original={version:2,maps:[{id:'old-map',title:'現在データ',nodes:[node('old-root','現在のルート',null,400,270),node('old-child','現在の子','old-root',620,180)],viewport:{x:12,y:34,scale:1.1},createdAt:now,updatedAt:now}],activeMapId:'old-map',updatedAt:now};
memory.set(key,JSON.stringify(original));window.testStorage={getItem:k=>memory.get(k)??null,setItem(k,v){if(failWrite)throw Error('QuotaExceededError');writes++;memory.set(k,v)},removeItem:k=>memory.delete(k)};
const frame=document.querySelector('iframe'),html=await(await fetch('../index.html',{cache:'no-store'})).text(),boot='<base href="'+new URL('../',location.href).href+'"><script>Object.defineProperty(window,"localStorage",{value:parent.testStorage});<\/script>';
await new Promise(resolve=>{frame.onload=resolve;frame.srcdoc=html.replace('<head>','<head>'+boot)});const w=frame.contentWindow,d=w.document,q=s=>d.querySelector(s),pause=(ms=60)=>new Promise(r=>setTimeout(r,ms));await pause();
w.URL.createObjectURL=blob=>{capturedBlob=blob;return'blob:test'};w.URL.revokeObjectURL=()=>{revoked=true};w.HTMLAnchorElement.prototype.click=function(){downloadName=this.download};
const assert=(v,m)=>{if(!v)throw Error(m)},stored=()=>JSON.parse(memory.get(key));
async function test(name,fn){const li=document.createElement('li');try{await fn();li.textContent='PASS '+name}catch(e){li.textContent='FAIL '+name+': '+e.message;li.className='fail'}document.querySelector('#results').append(li)}
const openBackup=()=>q('[data-action="more"]').click();
async function choose(value,name='backup.json'){const input=q('#backup-file'),file=value instanceof w.File?value:new w.File([typeof value==='string'?value:JSON.stringify(value)],name,{type:'application/json'});Object.defineProperty(input,'files',{value:[file],configurable:true});input.dispatchEvent(new w.Event('change',{bubbles:true}));await pause()}
const imported={version:2,maps:[{id:'map-one',title:'仕事',nodes:[node('r1','事業計画',null,400,270),node('c1','営業','r1',700,110)],viewport:{x:111,y:-55,scale:1.4},createdAt:1,updatedAt:2},{id:'map-two',title:'旅行',nodes:[node('r2','旅行案',null,333,222)],viewport:{x:-88,y:66,scale:.8},createdAt:3,updatedAt:4}],activeMapId:'map-two',updatedAt:5};
await test('menu exposes export and import with JSON accept',()=>{openBackup();assert(!q('#backup-menu').hidden,'menu');assert(q('#backup-file').accept.includes('.json'),'accept')});
await test('export writes all maps, latest data and safe filename',async()=>{q('#backup-menu').hidden=true;q('#quick-add').click();q('#node-name').value='未保存の追加';q('#node-form').dispatchEvent(new w.Event('submit',{bubbles:true,cancelable:true}));openBackup();q('[data-backup-action="export"]').click();await pause();const data=JSON.parse(await capturedBlob.text());assert(data.version===2&&data.maps[0].nodes.some(n=>n.text==='未保存の追加'),'latest');assert(!('selectedNodeId'in data)&&!('searchQuery'in data),'temporary state');assert(/^simple-mind-map-backup-\d{4}-\d{2}-\d{2}-\d{4}\.json$/.test(downloadName),'filename');assert(revoked,'revoke')});
await test('valid import waits for confirmation and cancel changes nothing',async()=>{const before=memory.get(key),title=q('h1').textContent,count=writes;await choose(imported);assert(q('#import-dialog').open&&memory.get(key)===before&&q('h1').textContent===title,'changed before confirm');q('[data-action="cancel-import"]').click();assert(memory.get(key)===before&&writes===count&&!q('#backup-file').value,'cancel')});
await test('valid version 2 restores maps, active map, viewport and lines',async()=>{q('#node-search').value='現在';q('#node-search').dispatchEvent(new w.Event('input',{bubbles:true}));await choose(imported);q('[data-action="confirm-import"]').click();await pause();assert(stored().maps.length===2&&stored().activeMapId==='map-two','saved');assert(q('h1').textContent==='旅行'&&q('.main-node').textContent==='旅行案','active');assert(q('.zoom-value').textContent==='80%'&&q('#node-search').value==='','viewport/search');assert(q('[data-action="undo"]').disabled,'history');q('[data-map-id="map-one"]').click();await pause(400);assert(d.querySelectorAll('.connections path').length===1&&q('.zoom-value').textContent==='140%','map/lines')});
await test('broken JSON is rejected without changing current data',async()=>{const before=memory.get(key);await choose('{broken');assert(memory.get(key)===before&&!q('#import-dialog').open&&q('#node-notice').textContent.includes('変更されていません'),'broken')});
await test('missing maps, duplicate node IDs and future version are rejected',async()=>{for(const value of [{version:2},{...imported,maps:[{...imported.maps[0],nodes:[node('x','a',null,1,1),node('x','b','x',2,2)]}]},{version:3,maps:[]}]){const before=memory.get(key);await choose(value);assert(memory.get(key)===before&&!q('#import-dialog').open,'invalid accepted')}assert(q('#node-notice').textContent.includes('新しいバージョン'),'future message')});
await test('oversized file is rejected before reading',async()=>{const before=memory.get(key),file=new w.File([new Uint8Array(10*1024*1024+1)],'huge.json');await choose(file);assert(memory.get(key)===before&&q('#node-notice').textContent.includes('10MB'),'size')});
await test('storage failure rolls back the in-memory import',async()=>{const before=memory.get(key),title=q('h1').textContent;failWrite=true;await choose(imported);q('[data-action="confirm-import"]').click();await pause();failWrite=false;assert(memory.get(key)===before&&q('h1').textContent===title&&q('#save-status-text').textContent==='保存できませんでした','rollback')});
await test('version 1 reuses migration and remains editable',async()=>{const v1={version:1,nodes:[node('root','旧バックアップ',null,400,270),node('child','旧データ','root',600,200)],viewport:{x:7,y:8,scale:1.2},updatedAt:9};await choose(v1);q('[data-action="confirm-import"]').click();await pause();assert(stored().version===2&&stored().maps[0].title==='マイマップ'&&q('.main-node').textContent==='旧バックアップ','migration');q('#quick-add').click();q('#node-name').value='復元後追加';q('#node-form').dispatchEvent(new w.Event('submit',{bubbles:true,cancelable:true}));assert(q('[data-action="undo"]').disabled===false,'new history');q('[data-action="undo"]').click();assert(![...d.querySelectorAll('.node')].some(e=>e.textContent==='復元後追加'),'undo')});
await test('same file can be selected again after every outcome',()=>assert(q('#backup-file').value==='', 'input reset'));
document.body.dataset.done='true';
})();
</script></html>
